name: ASCEND daily market scan
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ascend-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run research unit tests
        run: python -m unittest discover -s tests -v
      - name: Run ASCEND scanner
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner.py
      - name: Commit research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve this run's generated snapshot before updating our checkout.
          cp data/latest.json /tmp/ascend-latest.json
          cp data/performance.json /tmp/ascend-performance.json
          # Only publish the generated data file; never force-push or rewrite other work.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ascend-latest.json data/latest.json
            cp /tmp/ascend-performance.json data/performance.json
            git add data/latest.json data/performance.json
            if git diff --cached --quiet; then
              echo "Snapshot already published."
              exit 0
            fi
            git commit -m "Update ASCEND market scan"
            if git push origin HEAD:main; then
              echo "Snapshot published successfully."
              exit 0
            fi
            echo "Remote advanced during publish (attempt $attempt); retrying."
            sleep $((attempt * 2))
          done
          echo "::error::Unable to publish snapshot after 5 attempts."
          exit 1
